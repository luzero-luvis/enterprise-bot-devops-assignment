name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint chart
          helm lint lab/broken-chart

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./service
          load: true
          push: false
          tags: demo-service:${{ github.sha }}
      - name: Scan image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-service:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Publish image scan summary
        if: always()
        run: |
          {
            echo '## Image scan summary'
            echo
            echo '**Image:** `demo-service:${{ github.sha }}`'
            echo
            echo '```text'
            if [ -f trivy-report.txt ]; then
              cat trivy-report.txt
            else
              echo 'Trivy did not produce a report.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
